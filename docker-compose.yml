services:

  # ── Banco de dados PostgreSQL ─────────────────────────────────────────────
  db:
    image: postgres:15
    container_name: postgres_container
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ── RabbitMQ ──────────────────────────────────────────────────────────────
  # A tag "management" inclui a UI web em http://localhost:15672
  # Login padrão: guest / guest
  # A UI é útil em dev para inspecionar filas, mensagens e consumers em tempo real.
  rabbitmq:
    image: rabbitmq:3-management
    container_name: rabbitmq_container
    restart: always
    ports:
      - "5672:5672"    # porta AMQP (usada pelo Java)
      - "15672:15672"  # porta da Management UI (browser)
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USERNAME:-guest}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-guest}
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "check_port_connectivity"]
      interval: 10s
      timeout: 5s
      retries: 10

  # ── Backend Java (Spring Boot) ────────────────────────────────────────────
  backend:
    build:
      context: ../Domus_BackEnd/domus
      dockerfile: Dockerfile
    container_name: backend_container
    restart: no
    depends_on:
      db:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    environment:
      - SPRING_PROFILES_ACTIVE=dev
      - SPRING_DATASOURCE_URL=jdbc:postgresql://db:5432/${POSTGRES_DB}
      - SPRING_DATASOURCE_USERNAME=${POSTGRES_USER}
      - SPRING_DATASOURCE_PASSWORD=${POSTGRES_PASSWORD}
      - SPRING_JPA_HIBERNATE_DDL_AUTO=update
      - SPRING_JPA_SHOW_SQL=true
      - SPRING_JPA_PROPERTIES_HIBERNATE_DIALECT=org.hibernate.dialect.PostgreSQLDialect
      - JWT_SECRET=${JWT_SECRET}
      - JWT_EXPIRATION=${JWT_EXPIRATION:-3600000}
      - APP_DEMO_PASSWORD=${APP_DEMO_PASSWORD}
      - APP_ADMIN_PASSWORD=${APP_ADMIN_PASSWORD}
      - APP_ADMIN_LOGIN=${APP_ADMIN_LOGIN}
      - STATEMENT_SERVICE_URL=http://extrato:5000
      # RabbitMQ — aponta para o container rabbitmq (resolução DNS interna do Docker)
      - RABBITMQ_HOST=rabbitmq
      - RABBITMQ_PORT=5672
      - RABBITMQ_USERNAME=${RABBITMQ_USERNAME:-guest}
      - RABBITMQ_PASSWORD=${RABBITMQ_PASSWORD:-guest}
    ports:
      - "8080:8080"
    env_file:
      - .env

  # ── Microserviço Python (parser de extratos) ─────────────────────────────
  extrato:
    build:
      context: ../Domus_BackEnd_Py/domus_python
      dockerfile: Dockerfile.python
    container_name: extrato_container
    restart: always
    ports:
      - "5000:5000"

volumes:
  pgdata:
  rabbitmq_data:  # persiste as filas e mensagens entre restarts do container
